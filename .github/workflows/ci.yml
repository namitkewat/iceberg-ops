name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # weekly canary: newest deps inside the declared ranges
  workflow_dispatch:
  workflow_call:  # release.yml reuses these gates

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy iceberg_ops/

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-2025
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (deprecation warnings are errors)
        run: pytest -W error::DeprecationWarning

  floor:
    name: Tests at the declared floors (lowest-direct)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Install lowest direct versions
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv --resolution lowest-direct -e ".[dev]"
      - name: pytest
        run: .venv/bin/pytest -W error::DeprecationWarning

  docs:
    name: Docs (sphinx -W)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: sphinx-build
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Check the plain-text indexes exist
        run: |
          test -s docs/_build/html/llms.txt
          test -s docs/_build/html/llms-full.txt

  package:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install "build==1.6.1" "twine==7.0.0" "check-wheel-contents==0.6.3" "packaging>=24.2"
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify distributions
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
          python .github/scripts/check_dist.py dist
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          wheel="$(ls dist/*.whl)"
          "${RUNNER_TEMP}/smoke/bin/pip" install "${wheel}[sqlite,s3tables,transforms]"
          "${RUNNER_TEMP}/smoke/bin/python" -c "import boto3, pyiceberg_core, yaml, iceberg_ops"
          "${RUNNER_TEMP}/smoke/bin/iceberg-ops" --version
          # Exactly one console script is installed.
          "${RUNNER_TEMP}/smoke/bin/python" -c "from importlib.metadata import distribution; s = sorted(e.name for e in distribution('iceberg-ops').entry_points if e.group == 'console_scripts'); assert s == ['iceberg-ops'], s"
      - name: Smoke-test init + migrate from the installed wheel
        run: |
          bin="${RUNNER_TEMP}/smoke/bin"
          mkdir "${RUNNER_TEMP}/proj" && cd "${RUNNER_TEMP}/proj"
          "${bin}/iceberg-ops" init
          "${bin}/iceberg-ops" migrate
          # The default sqlite catalog lives next to the config file ...
          test -d local_data
          # ... and never inside site-packages.
          purelib="$("${bin}/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          test ! -e "${purelib}/local_data"

  canary:
    name: Canary (newest tools, Python ${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install, then lift the dev-tool caps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade ruff mypy pytest click pyarrow
      - name: Gates on newest tools
        run: |
          ruff check .
          ruff format --check .
          mypy iceberg_ops/
          pytest -W error::DeprecationWarning
