name: Release

# vX.Y.Z     -> gates -> build -> PyPI (Trusted Publishing + PEP 740) -> GitHub Release
# vX.Y.ZrcN  -> gates -> build -> TestPyPI only (dry run)
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Quality gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build once and verify
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Classify tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::tag ${TAG} is neither vX.Y.Z nor vX.Y.ZrcN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and the origin/* branches, for the ancestry check.
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${TAG} points at a commit that is not on main"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling (pinned)
        run: python -m pip install "build==1.6.1" "twine==7.0.0" "check-wheel-contents==0.6.3" "packaging>=24.2"

      - name: Build sdist and wheel
        run: python -m build

      - name: Tag must match the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          built="$(basename dist/*.whl | cut -d- -f2)"
          if [ "v${built}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match built version ${built}"
            exit 1
          fi

      - name: Verify distributions
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
          python .github/scripts/check_dist.py dist

      - name: Smoke-test the wheel in a clean venv
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          bin="${RUNNER_TEMP}/smoke/bin"
          "${bin}/pip" install "$(ls dist/*.whl)[sqlite]"
          test "$("${bin}/iceberg-ops" --version)" = "iceberg-ops ${TAG#v}"
          "${bin}/python" -c "from importlib.metadata import distribution; s = sorted(e.name for e in distribution('iceberg-ops').entry_points if e.group == 'console_scripts'); assert s == ['iceberg-ops'], s"
          mkdir "${RUNNER_TEMP}/proj" && cd "${RUNNER_TEMP}/proj"
          "${bin}/iceberg-ops" init
          "${bin}/iceberg-ops" --catalog sqlite --namespace smoke status
          "${bin}/iceberg-ops" migrate
          # The default sqlite catalog lives next to the config file ...
          test -d local_data
          # ... and a sqlite command never writes catalog files into site-packages.
          purelib="$("${bin}/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          test ! -e "${purelib}/local_data"

      - name: Project URLs resolve (final tags only)
        if: steps.tag.outputs.prerelease == 'false'
        run: python .github/scripts/check_dist.py dist --check-urls

      # Extracted here, not in github-release, so a missing CHANGELOG
      # section fails the run before anything is uploaded to PyPI.
      - name: Release notes from CHANGELOG.md (final tags only)
        if: steps.tag.outputs.prerelease == 'false'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="${RUNNER_TEMP}/notes/release_notes.md"
          mkdir -p "$(dirname "${notes}")"
          awk -v ver="${version}" '
            {
              if (capture==0 && index($0, "## [" ver "]") == 1) { capture=1; next }
              if (capture==1 && index($0, "## [") == 1)         { exit }
              if (capture==1) print
            }
          ' CHANGELOG.md > "${notes}"
          if [ ! -s "${notes}" ]; then
            echo "::error::no [${version}] section in CHANGELOG.md"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload release notes (final tags only)
        if: steps.tag.outputs.prerelease == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release_notes.md
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI (rc tags)
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/iceberg-ops
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI (final tags)
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/iceberg-ops
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI (attestations on by default)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub Release with the PyPI artifacts
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: notes/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file notes/release_notes.md \
            --verify-tag
