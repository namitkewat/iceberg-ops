name: Docs

# Publishes the Sphinx site to GitHub Pages. Main only: the github-pages
# environment accepts deployments from the default branch.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "iceberg_ops/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read-only by default; only the deploy job gets Pages and OIDC rights.
permissions:
  contents: read

# One deployment at a time; never cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the HTML site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package with docs extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Build HTML (warnings are errors)
        env:
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write     # publish the uploaded Pages artifact
      id-token: write  # OIDC token that proves the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
