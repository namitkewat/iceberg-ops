name: Feature request
description: Propose a new capability or an improvement.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check ROADMAP.md first: your idea may already be planned, and a
        comment on the matching issue helps more than a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API or CLI sketch welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools (Spark procedures, catalog-managed maintenance, other libraries) or workarounds.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
    validations:
      required: true
