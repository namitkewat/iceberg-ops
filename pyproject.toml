[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iceberg-ops"
dynamic = ["version"]
description = "Alembic-style schema migrations for Apache Iceberg: versioned, reviewable, autogenerated, with history in your catalog. Pure Python on PyIceberg."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Namit Kewat", email = "namitkewat@gmail.com" }]
keywords = [
    "apache-iceberg",
    "iceberg",
    "pyiceberg",
    "schema-migration",
    "migrations",
    "schema-evolution",
    "database-migrations",
    "autogenerate",
    "lakehouse",
    "data-engineering",
    "pyarrow",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pyiceberg>=0.12.0,<0.13",
    "pyarrow>=18.0.0",
    # 8.2 is the first release whose CliRunner captures stderr separately,
    # which the test suite relies on (the floor CI job runs it).
    "click>=8.2.0",
    # Reads the CLI config file (iceberg-ops.yaml) and YAML schema contracts.
    "pyyaml>=6.0.1",
    # Windows ships no IANA time-zone database; timestamptz columns need one.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# SQLite / in-memory catalog (CatalogFactory.build("sqlite") or "memory").
sqlite = ["pyiceberg[sql-sqlite]>=0.12.0,<0.13"]
# YAML schema contracts. PyYAML is a core dependency, so this extra is an
# alias that adds nothing to the core install.
contracts = ["pyyaml>=6.0.1"]
# AWS Glue catalog (CatalogFactory.build("glue")).
glue = ["pyiceberg[glue]>=0.12.0,<0.13"]
# REST-protocol Iceberg catalogs (Apache Polaris, Nessie, Lakekeeper, ...).
# PyIceberg's REST client is built in, so this extra is an alias that adds
# nothing beyond the core install.
rest = ["pyiceberg>=0.12.0,<0.13"]
# Hive Metastore catalog (CatalogFactory.build("hive")).
hive = ["pyiceberg[hive]>=0.12.0,<0.13"]
# AWS S3 Tables: PyIceberg's REST client with SigV4 request signing (boto3).
s3tables = ["pyiceberg[rest-sigv4]>=0.12.0,<0.13"]
# Apache Polaris policy executor (iceberg_ops.polaris), experimental: runs
# snapshot-expiry policies only and does not yet match the released Polaris
# policy API. `requests` talks to Polaris; the data plane uses PyIceberg's
# built-in REST client.
polaris = ["pyiceberg>=0.12.0,<0.13", "requests>=2.33.0", "urllib3>=2.8.0"]
# Writes to tables partitioned by bucket / truncate / year / month / day /
# hour transforms. PyIceberg owns the compatible pyiceberg-core range.
transforms = ["pyiceberg[pyiceberg-core]>=0.12.0,<0.13"]
# Documentation site (Sphinx + Furo). sphinx-click renders the CLI reference
# from the Click commands, myst-parser includes CHANGELOG.md, and
# sphinx-llms-txt writes plain-text indexes (llms.txt, llms-full.txt).
docs = [
    "sphinx>=9.1,<10",
    "furo>=2025.12.19",
    "sphinx-autodoc-typehints>=3.10,<4",
    "sphinx-click>=6.2,<7",
    "myst-parser>=5.0,<6",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinxext-opengraph>=0.13,<0.14",
    "sphinx-llms-txt>=0.7,<0.8",
]
# Development: test runner, linters, and the runtime extras the test suite
# exercises. Tool versions are capped by minor so upgrades arrive as
# deliberate pull requests.
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.17.4,<0.18",
    "mypy>=2.4.1,<2.5",
    "pyiceberg[sql-sqlite,pyiceberg-core]>=0.12.0,<0.13",
    "requests>=2.33.0",
]

[project.urls]
Homepage      = "https://github.com/namitkewat/iceberg-ops"
Documentation = "https://namitkewat.github.io/iceberg-ops/"
Changelog     = "https://github.com/namitkewat/iceberg-ops/blob/main/CHANGELOG.md"
Source        = "https://github.com/namitkewat/iceberg-ops"
Issues        = "https://github.com/namitkewat/iceberg-ops/issues"

[project.scripts]
iceberg-ops = "iceberg_ops.cli:main"

[tool.hatch.version]
path = "iceberg_ops/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["iceberg_ops"]

# Anchored allow-list: hatch patterns are gitignore-style, so an unanchored
# "README.md" would also match nested files of the same name.
[tool.hatch.build.targets.sdist]
include = [
    "/iceberg_ops",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/docs/_build", "**/__pycache__"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-m 'not bench'"
markers = [
    "bench: opt-in benchmark — skipped by default. Run with `pytest -m bench`.",
]

[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM108", # ternary operator — often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["iceberg_ops"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
